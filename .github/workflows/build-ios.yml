name: Build iOS IPA
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'ios/**'
      - '.github/workflows/build-ios.yml'
jobs:
  build-ios:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Show Xcode version
        run: xcodebuild -version
      - name: Setup Flutter (beta channel for Dart 3.11+)
        uses: subosito/flutter-action@v2
        with:
          channel: 'beta'
      - name: Flutter pub get
        run: |
          cd ios
          flutter pub get
      - name: Flutter build ios (generates Generated.xcconfig)
        run: |
          cd ios
          flutter build ios --release --no-codesign
      - name: Discover project
        id: proj
        run: |
          cd ios
          WORKSPACE=$(find . -maxdepth 2 -name "*.xcworkspace" -type d | head -1)
          if [[ -n "$WORKSPACE" ]]; then
            echo "workspace=$WORKSPACE" >> $GITHUB_OUTPUT
            echo "type=workspace" >> $GITHUB_OUTPUT
          else
            PROJECT=$(find . -maxdepth 2 -name "*.xcodeproj" -type d | head -1)
            if [[ -n "$PROJECT" ]]; then
              echo "project=$PROJECT" >> $GITHUB_OUTPUT
              echo "type=project" >> $GITHUB_OUTPUT
            else
              echo "No project found"; exit 1
            fi
          fi
      - name: Set scheme (Flutter app = Runner)
        id: scheme
        run: |
          echo "scheme=Runner" >> $GITHUB_OUTPUT
      - name: Build & Archive
        id: archive
        run: |
          cd ios
          if [[ "${{ steps.proj.outputs.type }}" == "workspace" ]]; then
            XC=(-workspace "${{ steps.proj.outputs.workspace }}")
          else
            XC=(-project "${{ steps.proj.outputs.project }}")
          fi
          SCHEME="${{ steps.scheme.outputs.scheme }}"
          echo "Building scheme: $SCHEME"
          xcodebuild "${XC[@]}" -scheme "$SCHEME" -configuration Release -destination generic/platform=iOS -archivePath "$PWD/build/Buds3Controller.xcarchive" archive CODE_SIGNING_ALLOWED=NO CODE_SIGN_IDENTITY="" PROVISIONING_PROFILE="" 2>&1 | tee build.log
      - name: Export IPA
        run: |
          cd ios
          cat > exportOptions.plist <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>ad-hoc</string>
            <key>compileBitcode</key><false/>
            <key>signingStyle</key><string>manual</string>
            <key>stripSwiftSymbols</key><true/>
          </dict></plist>
          EOF
          xcodebuild -exportArchive -archivePath "$PWD/build/Buds3Controller.xcarchive" -exportPath "$PWD/build/ipa" -exportOptionsPlist "$PWD/exportOptions.plist" 2>&1 | tee export.log
      - uses: actions/upload-artifact@v4
        with:
          name: Buds3Controller-ipa
          path: ios/build/ipa/*.ipa
          retention-days: 7
